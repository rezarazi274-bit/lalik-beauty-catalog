<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lalik Beauty | کاتالوگ آنلاین</title>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #fff5f8; margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, #ff4d8d, #ff85b3); color: white; padding: 30px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.05); text-align: center; transition: 0.3s; border: 1px solid #ffe0eb; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(255, 77, 141, 0.2); }
        .product-img { width: 100%; height: 180px; object-fit: cover; background-color: #f9f9f9; }
        .product-info { padding: 12px; }
        .product-title { font-size: 15px; font-weight: 700; color: #444; margin: 5px 0; }
        .product-price { color: #ff4d8d; font-weight: bold; font-size: 14px; margin-bottom: 12px; }
        .buy-btn { display: block; background-color: #ff4d8d; color: white; text-decoration: none; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .buy-btn:hover { background-color: #e63e7a; }
    </style>
</head>
<body>

<header>
    <h1>Lalik Beauty</h1>
    <p>تجربه زیبایی با محصولات اصل</p>
</header>

<div class="container" id="product-container">
    <!-- محصولات به صورت خودکار اینجا ساخته می‌شوند -->
</div>

<!-- لود کردن لیست محصولات و کدهای اصلی -->
<script src="products.js"></script>
<script>
    const container = document.getElementById('product-container');

    // نمایش محصولات
    products.forEach(product => {
        const card = `
            <div class="product-card">
                <img src="${product.image}" alt="${product.name}" class="product-img">
                <div class="product-info">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} تومان</div>
                    <a href="${product.telegramLink}" class="buy-btn">خرید مستقیم</a>
                </div>
            </div>
        `;
        container.innerHTML += card;
    });
</script>

</body>
</html>
